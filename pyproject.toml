[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setlistash"
dynamic = ["version"]
description = "Cross-platform CLI tool to create complete local CSV and Markdown backups of attended concerts from Setlist.fm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Leonardo Pintus (sutnip)" },
]
keywords = [
    "setlistfm",
    "setlist",
    "backup",
    "archive",
    "cli",
    "music",
    "concerts",
    "markdown",
    "csv",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "platformdirs>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/sutnip/setlistash"
Repository = "https://github.com/sutnip/setlistash"
Issues = "https://github.com/sutnip/setlistash/issues"

[project.scripts]
setlistash = "setlistash.cli:main"
slstash = "setlistash.cli:main"
slfm-stash = "setlistash.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "setlistash.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"